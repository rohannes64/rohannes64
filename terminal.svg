  </style>
  <rect class="bg" x="0" y="0" width="600" height="90" rx="6"/>
  <text class="txt" x="12" y="34">$ whoami</text>
  <text class="txt" x="12" y="68">$ Vemuri Rohan<tspan class="cursor">▌</tspan></text>
</svg>
