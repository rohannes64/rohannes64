<svg xmlns="http://www.w3.org/2000/svg" width="600" height="90" viewBox="0 0 600 90">
  <style>
    .bg { fill: #0D1117; }
    .txt { font-family: "Fira Code", "DejaVu Sans Mono", Consolas, monospace; font-size: 22px; fill: #00FF41; }
    .cursor { fill: #00FF41; animation: blink 1s steps(1, end) infinite; }
